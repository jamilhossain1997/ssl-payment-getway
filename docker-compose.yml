services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: sslcz_app
    restart: unless-stopped

    volumes:
      - ./:/var/www/html

    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-sslcz}
      DB_USERNAME: ${DB_USERNAME:-sslcz}
      DB_PASSWORD: ${DB_PASSWORD:-secret}

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - sslcz_net


  nginx:
    image: nginx:stable-alpine

    container_name: sslcz_nginx
    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - sslcz_net


  mysql:
    image: mysql:8.0

    container_name: sslcz_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sslcz}
      MYSQL_USER: ${DB_USERNAME:-sslcz}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}

    ports:
      - "3307:3306"

    volumes:
      - sslcz_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${DB_ROOT_PASSWORD:-rootsecret}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    networks:
      - sslcz_net


  ngrok:
    image: ngrok/ngrok:latest

    container_name: sslcz_ngrok
    restart: unless-stopped

    command:
      - http
      - nginx:80

    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}

    ports:
      - "4040:4040"

    depends_on:
      - nginx

    networks:
      - sslcz_net


networks:
  sslcz_net:
    driver: bridge


volumes:
  sslcz_mysql_data:
    driver: local