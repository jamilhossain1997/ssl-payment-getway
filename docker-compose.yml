services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sslcz_app
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-sslcz}
      - DB_USERNAME=${DB_USERNAME:-sslcz}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      - mysql
    networks:
      - sslcz_net

  nginx:
    image: nginx:stable-alpine
    container_name: sslcz_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - sslcz_net

  mysql:
    image: mysql:8.0
    container_name: sslcz_mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-sslcz}
      - MYSQL_USER=${DB_USERNAME:-sslcz}
      - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3307:3306" # host 3307 avoids clashing with a local MySQL already on 3306
    volumes:
      - sslcz_mysql_data:/var/lib/mysql
    networks:
      - sslcz_net

  # Exposes your local Nginx (port 8000) on a public HTTPS URL so
  # SSLCommerz can reach success_url/fail_url/cancel_url/ipn_url.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: sslcz_ngrok
    restart: unless-stopped
    command: ["http", "nginx:80"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040" # ngrok's local inspection dashboard: http://localhost:4040
    depends_on:
      - nginx
    networks:
      - sslcz_net

networks:
  sslcz_net:
    driver: bridge

volumes:
  sslcz_mysql_data:
