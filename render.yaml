services:
  - type: web
    name: ssl-payment-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_KEY
        generateValue: true

      - key: DB_CONNECTION
        value: pgsql

      # Paste your full Neon pooled connection URL here or mark sync: false
      - key: DATABASE_URL
        sync: false

      - key: SSLCOMMERZ_MODE
        value: sandbox

      - key: SSLCOMMERZ_STORE_ID
        sync: false

      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false